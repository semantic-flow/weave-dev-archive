version: 1
schemas:
  - id: ont
    parent: root
    # Apply task/plan templates beneath their respective year buckets.
    children:
      - pattern: "task"
        children:
          - pattern: "[0-2][0-9][0-9][0-9]"
            children:
              - pattern: "*"
                template: template.task
      - pattern: "plan"
        children:
          - pattern: "[0-2][0-9][0-9][0-9]"
            children:
              - pattern: "*"
                template: template.plan
